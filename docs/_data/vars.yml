# Variables exposed to docmd pages via docmd-plugin-rsigma.
# version, edition, msrv, license, and crate_count are read from the
# workspace Cargo.toml at build time by the plugin and override anything set here.
rsigma:
  repo: "timescale/rsigma"
  repo_url: "https://github.com/timescale/rsigma"
  docker_image: "ghcr.io/timescale/rsigma"
  # Lint catalogue sizes, referenced across the docs as {{ rsigma.lint.rules }}
  # etc. Update here (one place) when adding or removing a lint rule; keep in
  # sync with the enum in crates/rsigma-parser/src/lint and the per-severity
  # breakdown table in docs/reference/lint-rules.md.
  lint:
    rules: 91 # built-in checks emitted in production
    autofix: 14 # built-in checks with a safe --fix
    reserved: 1 # enum values declared but not emitted (empty_filter_rules)
    total: 92 # rules + reserved
  # Prometheus metric catalogue sizes for `engine daemon` under `--all-features`.
  # Referenced as {{ rsigma.metrics.names }} etc. Keep in sync with
  # crates/rsigma-cli/src/daemon/metrics.rs and docs/content/reference/metrics.md.
  metrics:
    names: 98 # total metric names in the definition catalogue
    always: 93 # registered without feature gates (names - otlp - tls)
    otlp: 3 # daemon-otlp
    tls: 2 # daemon-tls
  crates:
    - { name: rsigma-parser, role: "Parse Sigma YAML into a strongly-typed AST" }
    - { name: rsigma-eval, role: "Compile and evaluate rules against JSON events" }
    - { name: rsigma-ir, role: "Serializable high-level intermediate representation (HIR) of Sigma rules" }
    - { name: rsigma-convert, role: "Transform rules into backend-native query strings" }
    - { name: rsigma-runtime, role: "Streaming runtime with input adapters, log processor, and hot-reload" }
    - { name: rsigma, role: "CLI for parsing, validating, linting, evaluating, converting rules, and running the daemon" }
    - { name: rsigma-mcp, role: "Model Context Protocol (MCP) server exposing the toolchain to AI agents" }
    - { name: rsigma-lsp, role: "Language Server Protocol (LSP) server for IDE support" }
    - { name: rstix, role: "STIX 2.1 library: typed objects, bundle parse/stream, T0/T1/T2 validation tiers, pattern parse/eval, graph/marking/store" }
