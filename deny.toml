[advisories]
# Surface unmaintained-crate advisories as warnings so they are visible
# in the audit run without breaking CI; we cannot drop transitive
# unmaintained deps unilaterally but we want to see them.
unmaintained = "workspace"
# chrono was marked unmaintained on 2026-11-17 and has no replacement.
# humantime is listed only because it wraps chrono.
# https://github.com/chronotope/chrono/issues/1768
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono has no maintained replacement" },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained because it wraps chrono" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# psm, which every crate reaches through pest's stack guard, builds its
# assembly archive with ar_archive_writer. It is a build dependency only, and
# the LLVM exception adds a permission to Apache-2.0 without restricting it.
[[licenses.exceptions]]
crate = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
# Refuse wildcard dependencies. `version = "*"` in a workspace member
# undermines lockfile reproducibility and makes supply-chain review
# impossible. Use a concrete version or version range.
wildcards = "deny"
# Exempt path dependencies inside the workspace from the wildcard ban. This
# covers version-less path dev-dependencies used to break publish-time
# dependency cycles (e.g. rsigma-ir's dev-dependency on rsigma-eval, which
# depends on rsigma-ir); cargo strips dev-dependencies when packaging, so the
# published crate carries no wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
