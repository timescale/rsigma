# Pin local builds to the workspace MSRV. CI reads this channel through the
# repository's setup-rust action and installs only each job's required
# components and targets. Fuzzing uses its separately pinned nightly.
#
# This file is honored by `rustup` when no explicit `+toolchain`
# selector is on the command line. Contributors who run `cargo build`
# or `cargo test` from a checkout get the same toolchain that the
# CI and release workflows use, so toolchain drift is reproducible
# locally before a PR reaches CI.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy", "rust-analyzer"]
profile = "minimal"
