name: Engine (test backend)

# Compares the test backend's output with pySigma's TextQueryTestBackend.
# Triggered only by changes to that backend, its engine test and image, the
# shared engine cases, or the shared conversion core.
on:
  push:
    branches: [main]
    paths: &paths
      - ".github/actions/setup-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/rsigma-convert/Cargo.toml"
      - "crates/rsigma-convert/src/*.rs"
      - "crates/rsigma-convert/src/backends/test.rs"
      - "crates/rsigma-parser/Cargo.toml"
      - "crates/rsigma-parser/src/**"
      - "crates/rsigma-ir/Cargo.toml"
      - "crates/rsigma-ir/src/**"
      - "crates/rsigma-convert/tests/engines/mod.rs"
      - "crates/rsigma-convert/tests/engines/cases/**"
      - "crates/rsigma-convert/tests/engines/pysigma/**"
      - "crates/rsigma-convert/tests/engine_test_backend.rs"
      - ".github/workflows/engine-test-backend.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: engine-test-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test-backend:
    name: Test backend versus pySigma
    runs-on: ubuntu-latest
    permissions:
      contents: read # read repo for checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compare the cases with pySigma
        run: cargo test -p rsigma-convert --locked --test engine_test_backend -- --ignored
