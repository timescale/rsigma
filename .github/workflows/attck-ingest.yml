name: ATT&CK ingest proof

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: attck-ingest-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  attck-ingest:
    name: ATT&CK paginated ingest
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Download MITRE ATT&CK STIX bundle (pinned release)
        run: |
          curl -fsSL -o /tmp/enterprise-attack-19.2.json \
            https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack-19.2.json
      - name: Paginated ingest test (real corpus)
        run: |
          cargo test -p rstix --features taxii-store,validate --test taxii_store \
            ingest_attck_corpus_paginated_when_present --locked -- --nocapture
        env:
          RSTIX_ATTCK_BUNDLE: /tmp/enterprise-attack-19.2.json
