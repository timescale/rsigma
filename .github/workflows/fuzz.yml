name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly on Monday at 03:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds per fuzz target"
        required: false
        default: "180"

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Pin past floating `nightly`: rustc 1.99.0-nightly 2026-07-24+ ICEs compiling
  # tokio under -Zsanitizer=address (rust-lang/rust#159815). Last known-good for
  # cargo-fuzz+ASan is 2026-07-23; bump when the fix lands in a published nightly.
  FUZZ_TOOLCHAIN: nightly-2026-07-23

jobs:
  # Every target links the same dependency graph, so compile them in one job
  # and hand the binaries to the matrix instead of compiling 36 times. There is
  # no rust-cache here: a weekly entry is the least recently used in the repo's
  # cache, so it is evicted before the next run, and saving it evicts CI's.
  build:
    name: Build fuzz targets
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        run: |
          rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal --component llvm-tools-preview
          rustup default "${FUZZ_TOOLCHAIN}"

      - name: Install cargo-fuzz
        # Build cargo-fuzz with the pinned nightly explicitly. The repo's
        # rust-toolchain.toml pins ambient `cargo` to the MSRV, which is too
        # old to compile recent cargo-fuzz dependencies, so select the fuzz
        # toolchain with `+${FUZZ_TOOLCHAIN}` to match the build below.
        run: cargo "+${FUZZ_TOOLCHAIN}" install cargo-fuzz --locked

      - name: Build every target
        working-directory: fuzz
        run: |
          cargo "+${FUZZ_TOOLCHAIN}" fuzz build
          # tar keeps the executable bit, which artifact uploads drop.
          cd target/x86_64-unknown-linux-gnu/release
          find . -maxdepth 1 -type f -executable -name 'fuzz_*' -printf '%f\n' \
            | tar -cf "${GITHUB_WORKSPACE}/fuzz-targets.tar" -T -

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-targets
          path: fuzz-targets.tar
          retention-days: 1

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repo
      actions: read # download the corpus a previous run uploaded
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fuzz_parse_yaml
            max_len: 8192
          - target: fuzz_rule_fmt
            max_len: 8192
          - target: fuzz_condition
            max_len: 512
          - target: fuzz_eval_matching
            max_len: 65536
          - target: fuzz_field_modifiers
            max_len: 256
          - target: fuzz_regex_compile
            max_len: 1024
          - target: fuzz_pipeline_yaml
            max_len: 4096
          - target: fuzz_apply_modifiers
            max_len: 1024
          - target: fuzz_input_formats
            max_len: 4096
          - target: fuzz_rule_tune
            max_len: 65536
          - target: fuzz_draft_groups
            max_len: 65536
          - target: fuzz_pipeline_sources_yaml
            max_len: 8192
          - target: fuzz_watchlist_request
            max_len: 4096
          - target: fuzz_alert_pipeline_config
            max_len: 4096
          - target: fuzz_enrichers_config
            max_len: 65536
          - target: fuzz_extract_jq
            max_len: 4096
          - target: fuzz_extract_jsonpath
            max_len: 4096
          - target: fuzz_extract_cel
            max_len: 4096
          - target: fuzz_template_expand
            max_len: 4096
          - target: fuzz_include_parse
            max_len: 8192
          - target: fuzz_http_response
            max_len: 65536
          - target: fuzz_rstix_parse_bundle
            max_len: 65536
          - target: fuzz_rstix_validate_json
            max_len: 65536
          - target: fuzz_stix_pattern
            max_len: 4096
          - target: fuzz_taxii_envelope
            max_len: 65536
          - target: fuzz_taxii_headers
            max_len: 1024
          - target: fuzz_taxii_dns_records
            max_len: 4096
          - target: fuzz_rstix_email_roundtrip
            max_len: 8192
          - target: fuzz_stix_source
            max_len: 262144
          - target: fuzz_stix_draft
            max_len: 65536
          - target: fuzz_capture_spool
            max_len: 65536
          - target: fuzz_otlp_logs_decode
            max_len: 65536
          - target: fuzz_otlp_logs_json
            max_len: 65536
          - target: fuzz_line_framer
            max_len: 4096
          - target: fuzz_field_keys
            max_len: 16384
          - target: fuzz_mmdb_record
            max_len: 65536
          - target: fuzz_dns_answer
            max_len: 4096
          - target: fuzz_ruleset_resolve
            max_len: 4096
          - target: fuzz_ocsf_sidecar
            max_len: 8192
          - target: fuzz_host_guard
            max_len: 1024
          - target: fuzz_enricher_extract
            max_len: 4096
          - target: fuzz_postgres_select_fields
            max_len: 1024
          - target: fuzz_correlation_absence
            max_len: 8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-targets
          path: ${{ runner.temp }}

      # The corpus lives in an artifact rather than the cache, which evicts a
      # weekly entry before the next run. Only runs on main feed it forward.
      - name: Restore the corpus from the last run on main
        env:
          GH_TOKEN: ${{ github.token }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/${FUZZ_TARGET}"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=fuzz-corpus-${FUZZ_TARGET}&per_page=100" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")][0].id // empty')
          if [ -z "${id}" ]; then
            echo "No corpus from an earlier run on main; starting from the committed inputs."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${RUNNER_TEMP}/corpus.zip"
          unzip -q -o "${RUNNER_TEMP}/corpus.zip" -d "fuzz/corpus/${FUZZ_TARGET}"

      - name: Run fuzzer
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_MAX_LEN: ${{ matrix.max_len }}
          FUZZ_DURATION: ${{ github.event.inputs.duration || '180' }}
          # `cargo fuzz run` sets this for ASan builds; the binary runs directly here.
          ASAN_OPTIONS: detect_odr_violation=0
        run: |
          tar -xf "${RUNNER_TEMP}/fuzz-targets.tar" -C "${RUNNER_TEMP}" "${FUZZ_TARGET}"
          mkdir -p "corpus/${FUZZ_TARGET}" "seeds/${FUZZ_TARGET}" "artifacts/${FUZZ_TARGET}"
          "${RUNNER_TEMP}/${FUZZ_TARGET}" \
            -artifact_prefix="artifacts/${FUZZ_TARGET}/" \
            -max_total_time="${FUZZ_DURATION}" \
            -timeout=10 \
            -max_len="${FUZZ_MAX_LEN}" \
            "corpus/${FUZZ_TARGET}" "seeds/${FUZZ_TARGET}"

      - name: Upload corpus
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 90

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
