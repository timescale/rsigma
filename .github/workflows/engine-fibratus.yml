name: Engine (Fibratus)

# Evaluates the Fibratus backend's filters with Fibratus's own filter parser
# and evaluator, which only build for Windows. Triggered only by changes to
# that backend, the fibratus_windows pipeline, its engine tests and harness,
# the shared engine cases, or the shared conversion core.
on:
  push:
    branches: [main]
    paths: &paths
      - ".github/actions/setup-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/rsigma-convert/Cargo.toml"
      - "crates/rsigma-convert/src/*.rs"
      - "crates/rsigma-convert/src/backends/fibratus/**"
      - "crates/rsigma-parser/Cargo.toml"
      - "crates/rsigma-parser/src/**"
      - "crates/rsigma-ir/Cargo.toml"
      - "crates/rsigma-ir/src/**"
      - "crates/rsigma-eval/Cargo.toml"
      - "crates/rsigma-eval/src/pipeline/**"
      - "crates/rsigma-eval/pipelines/fibratus_windows.yml"
      - "crates/rsigma-convert/tests/engines/mod.rs"
      - "crates/rsigma-convert/tests/engines/cases/**"
      - "crates/rsigma-convert/tests/engines/fibratus/**"
      - "crates/rsigma-convert/tests/engine_fibratus.rs"
      - ".github/workflows/engine-fibratus.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: engine-fibratus-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fibratus:
    name: Fibratus engine tests
    runs-on: windows-latest
    permissions:
      contents: read # read repo for checkout
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: crates/rsigma-convert/tests/engines/fibratus/go.mod
          cache-dependency-path: crates/rsigma-convert/tests/engines/fibratus/go.sum
      - name: Evaluate the cases with Fibratus
        run: cargo test -p rsigma-convert --locked --test engine_fibratus -- --ignored
