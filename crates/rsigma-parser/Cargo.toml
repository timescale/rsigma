[package]
name = "rsigma-parser"
description = "Parser for Sigma detection rules, correlations, and filters"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["fix", "fmt"]
fix = ["dep:yamlpatch", "dep:yamlpath"]
fmt = ["dep:tree-sitter", "dep:tree-sitter-yaml"]

[dependencies]
fancy-regex = "0.20"
globset = "0.4"
log = "0.4"
pest = "2"
pest_derive = "2"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
stacker = "0.1.25"
tree-sitter = { version = "0.27", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
yaml_serde = "0.10"
yamlpath = { version = "1.32", optional = true }
yamlpatch = { version = "1.32", optional = true }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = "0.8"
insta = "1.46"
rand = "0.10"
tempfile = "3"

[[bench]]
name = "parse"
harness = false

[[test]]
name = "fmt_golden"
required-features = ["fmt"]

[[test]]
name = "fmt_parity"
required-features = ["fmt"]

[[test]]
name = "fmt_range"
required-features = ["fmt"]

[[test]]
name = "fmt_refusals"
required-features = ["fmt"]
