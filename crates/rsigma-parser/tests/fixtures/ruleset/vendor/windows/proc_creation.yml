title: Windows whoami execution
id: aaaaaaaa-0000-4000-8000-000000000001
name: windows_whoami
status: stable
description: whoami runs to discover the current user.
author: Test Author
level: high
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\whoami.exe'
    condition: selection
tags:
    - attack.discovery
    - attack.execution
    - attack.t1059.001
