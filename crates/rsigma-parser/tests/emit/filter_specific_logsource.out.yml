title: Drop admin whoami
id: 22222222-3333-4444-5555-666666666666
logsource:
    product: windows
    service: security
filter:
    rules:
        - 11111111-2222-3333-4444-555555555555
        - whoami_rule
    filter_main_system:
        User: SYSTEM
    selection:
        Image|endswith: '\whoami.exe'
    condition: selection and not filter_main_system
