title: Burst with reserved custom attributes
id: 3f6b1c2e-0000-4000-8000-000000000002
correlation:
    type: event_count
    rules:
        - failed_login
    group-by:
        - User
    timespan: 5m
    condition:
        gte: 10
logsource:
    product: windows
custom_attributes:
    rsigma.action: reset
    filter: not a filter
    action: global
    detection:
        selection:
            a: b
level: high
