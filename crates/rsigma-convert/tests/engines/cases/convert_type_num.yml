description: A pipeline convert_type with pySigma's num target turns a quoted number into a number.
rule:
  title: convert type num
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      ProcessId: '4688'
    condition: selection
pipeline:
  name: numeric process ids
  priority: 10
  transformations:
    - id: pid_num
      type: convert_type
      target_type: num
events:
  - {ProcessId: 4688}
  - {ProcessId: 4689}
  - {ProcessId: 46880}
matches: [0]
