description: A negated hashes item stays negated after hashes_fields splits it, so the filter excludes every listed hash.
rule:
  title: hashes fields neq
  logsource: {category: process_creation, product: windows}
  detection:
    selection:
      Image|endswith: '\x.exe'
    filter:
      Hashes|contains|neq:
        - 'MD5=0123456789abcdef0123456789abcdef'
        - 'SHA1=0123456789abcdef0123456789abcdef01234567'
    condition: selection and filter
pipeline:
  name: split hashes
  priority: 10
  transformations:
    - id: hashes
      type: hashes_fields
      valid_hash_algos: [MD5, SHA1]
      field_prefix: File
      drop_algo_prefix: false
events:
  - {Image: 'C:\x.exe', FileMD5: '0123456789abcdef0123456789abcdef', FileSHA1: 'ffffffffffffffffffffffffffffffffffffffff'}
  - {Image: 'C:\x.exe', FileMD5: 'ffffffffffffffffffffffffffffffff', FileSHA1: '0123456789abcdef0123456789abcdef01234567'}
  - {Image: 'C:\x.exe', FileMD5: 'ffffffffffffffffffffffffffffffff', FileSHA1: 'ffffffffffffffffffffffffffffffffffffffff'}
  - {Image: 'C:\y.exe', FileMD5: 'ffffffffffffffffffffffffffffffff', FileSHA1: 'ffffffffffffffffffffffffffffffffffffffff'}
matches: [2]
known_failures:
  test-pysigma:
    type: output-difference
    reason: "pySigma's hashes_fields drops neq from the items it creates, so its query matches the hashes the rule excludes"
    actual: ["Image endswith \"\\x.exe\" and not FileMD5=\"0123456789abcdef0123456789abcdef\" and not FileSHA1=\"0123456789abcdef0123456789abcdef01234567\""]
    reference: ["Image endswith \"\\x.exe\" and (FileMD5=\"0123456789abcdef0123456789abcdef\" or FileSHA1=\"0123456789abcdef0123456789abcdef01234567\")"]
