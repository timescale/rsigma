# Splunk Common Information Model (CIM) field mapping: Network Traffic datamodel.
#
# Maps generic Sigma / Sysmon-style field names on `network_connection` rules to
# CIM field names as indexed after a typical CIM-compliant Network Traffic
# extraction (All_Traffic dataset). v1 scope is one category only; extend when
# fixtures exist for other datamodels.
#
# Provenance: field names per Splunk CIM Network Traffic / All_Traffic
# (https://docs.splunk.com/Documentation/CIM/latest/User/NetworkTraffic).
# Sysmon-oriented Sigma vocabulary aligned with `ecs_windows` network block.
#
# Path-only: load by file path (not a builtin short name).
#
# Usage:
#   rsigma engine eval -r rules/ -p crates/rsigma-eval/pipelines/cim_network_traffic.yml -e @event.json

name: cim_network_traffic
priority: 20

transformations:
  - id: cim_network_traffic_fields
    type: field_name_mapping
    mapping:
      SourceIp: src_ip
      SourceHostname: src
      SourcePort: src_port
      DestinationIp: dest_ip
      DestinationHostname: dest
      DestinationPort: dest_port
      DestinationPortName: app
      Protocol: transport
      User: user
    rule_conditions:
      - type: logsource
        category: network_connection
