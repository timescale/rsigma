# CrowdStrike Falcon Windows endpoint event field mapping.
#
# Maps generic Sigma / Sysmon-style field names on Windows logsource rules
# to Falcon sensor JSON attribute names (`event_simpleName` discriminators
# plus flat fields such as `ImageFileName`, `RemoteAddressIP4`, ...). Intended
# for evaluating Sigma rules against Falcon FDR / NG-SIEM JSON lines with `-p`.
#
# Provenance: Falcon Events Data Dictionary (FDR export shape).
# Scope: five portable Sigma categories on `product: windows`. macOS/Linux
# sensor events use different platform fields and are outside this file.
#
# `ParentImage` maps to `ParentBaseFileName` (executable file name, not a full path).
#
# Path-only: load by file path (not a builtin short name).
#
# Usage:
#   rsigma engine eval -r rules/ -p crates/rsigma-eval/pipelines/falcon_windows.yml -e @event.json

name: falcon_windows
priority: 20

transformations:
  - id: falcon_process_creation_fields
    type: field_name_mapping
    mapping:
      Image: ImageFileName
      CommandLine: CommandLine
      ParentImage: ParentBaseFileName
      ParentProcessId: ParentProcessId
      ProcessId: RawProcessId
    rule_conditions:
      - type: logsource
        product: windows
        category: process_creation

  - id: falcon_process_creation_event
    type: add_condition
    prepend: true
    conditions:
      event_simpleName: ProcessRollup2
    rule_conditions:
      - type: logsource
        product: windows
        category: process_creation

  - id: falcon_network_connection_fields
    type: field_name_mapping
    mapping:
      SourceIp: LocalAddressIP4
      SourcePort: LocalPort
      DestinationIp: RemoteAddressIP4
      DestinationPort: RemotePort
      DestinationHostname: DomainName
      Image: ImageFileName
      ProcessId: ContextProcessId
      User: UserName
    rule_conditions:
      - type: logsource
        product: windows
        category: network_connection

  - id: falcon_network_connection_event
    type: add_condition
    prepend: true
    conditions:
      event_simpleName: NetworkConnectIP4
    rule_conditions:
      - type: logsource
        product: windows
        category: network_connection

  - id: falcon_file_event_fields
    type: field_name_mapping
    mapping:
      TargetFilename: TargetFileName
      User: UserName
    rule_conditions:
      - type: logsource
        product: windows
        category: file_event

  - id: falcon_file_event_simple_name
    type: add_condition
    prepend: true
    conditions:
      event_simpleName:
        - PeFileWritten
        - FileWritten
        - NewFileWritten
    rule_conditions:
      - type: logsource
        product: windows
        category: file_event

  - id: falcon_dns_query_fields
    type: field_name_mapping
    mapping:
      QueryName: DomainName
    rule_conditions:
      - type: logsource
        product: windows
        category: dns_query

  - id: falcon_dns_query_event
    type: add_condition
    prepend: true
    conditions:
      event_simpleName: DnsRequest
    rule_conditions:
      - type: logsource
        product: windows
        category: dns_query

  - id: falcon_image_load_fields
    type: field_name_mapping
    mapping:
      ImageLoaded: FileName
      Image: ImageFileName
    rule_conditions:
      - type: logsource
        product: windows
        category: image_load

  - id: falcon_image_load_event
    type: add_condition
    prepend: true
    conditions:
      event_simpleName: ImageLoadRollup2
    rule_conditions:
      - type: logsource
        product: windows
        category: image_load
